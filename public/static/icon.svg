<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="104" fill="#0b0d10"/>
  <!-- burning ring: the fuse gauge -->
  <circle cx="256" cy="282" r="148" fill="none" stroke="#1c2126" stroke-width="34"/>
  <path d="M 256 134 A 148 148 0 1 1 133.6 366.4" fill="none" stroke="#e8a15c" stroke-width="34" stroke-linecap="round"/>
  <!-- fuse tail from the burn point -->
  <path d="M 133.6 366.4 C 108 342, 96 316, 92 286" fill="none" stroke="#e8a15c" stroke-width="20" stroke-linecap="round"/>
  <!-- spark at the fuse tip -->
  <g transform="translate(90 268)">
    <path d="M0 -34 L7 -9 L32 -14 L11 2 L24 26 L0 12 L-24 26 L-11 2 L-32 -14 L-7 -9 Z" fill="#f4c07e"/>
    <circle r="9" fill="#f8d9a8"/>
  </g>
  <!-- bold Z mark -->
  <text x="256" y="336" font-family="Menlo, monospace" font-size="150" font-weight="700" fill="#e8a15c" text-anchor="middle">Z</text>
</svg>
